name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Fetch private Yunyin assets at build time. Keep yunyin/assets out of Git.
      - name: Fetch private game assets
        if: ${{ secrets.ASSETS_PAT != '' && secrets.ASSETS_REPO != '' }}
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.ASSETS_PAT }}@github.com/${{ secrets.ASSETS_REPO }}.git" tmp-assets
          rm -rf tmp-assets/.git
          mkdir -p yunyin/assets
          cp -r tmp-assets/* yunyin/assets/
          rm -rf tmp-assets

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy To Pages
        id: deployment
        uses: actions/deploy-pages@v4
